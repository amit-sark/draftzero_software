<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Razorpay Payment | DraftZero</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        :root {
            --gz-primary: #667eea;
            --gz-primary-dark: #5568d3;
            --gz-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gz-radius: 18px;
        }

        .gz-body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--gz-gradient);
            background-attachment: fixed;
            font-family: "Inter", "Segoe UI", sans-serif;
        }

        .gz-container {
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.15);
            padding: 40px 45px;
            border-radius: var(--gz-radius);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            color: #fff;
            width: 90%;
            max-width: 420px;
            text-align: center;
            animation: gz-fadeIn 0.6s ease;
        }

        .gz-title {
            font-size: 1.8rem;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .gz-subtext {
            color: #f0f0f0;
            font-size: 0.95rem;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        .gz-amount {
            font-size: 2.2rem;
            color: #fff;
            font-weight: 700;
            margin: 25px 0 15px;
        }

        .gz-btn {
            background: #fff;
            color: var(--gz-primary);
            border: none;
            padding: 14px 38px;
            font-size: 1rem;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.25);
        }

        .gz-btn:hover {
            background: var(--gz-primary);
            color: #fff;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
            transform: translateY(-2px);
        }

        .gz-status {
            margin-top: 25px;
            padding: 14px;
            border-radius: 12px;
            display: none;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .gz-success {
            background: rgba(40, 167, 69, 0.2);
            color: #b6f7c1;
            display: block;
        }

        .gz-error {
            background: rgba(220, 53, 69, 0.2);
            color: #f7b6b6;
            display: block;
        }

        .gz-processing {
            background: rgba(255, 193, 7, 0.2);
            color: #ffe6a1;
            display: block;
        }

        @keyframes gz-fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .gz-container {
                padding: 30px;
            }
            .gz-amount {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body class="gz-body">
    <div class="gz-container">
        <h2 class="gz-title">Complete Your Payment</h2>
        <div class="gz-amount">₹{{ amount }}</div>
        <p class="gz-subtext">Order ID: <strong>{{ order_id }}</strong></p>
        <button class="gz-btn" onclick="startPayment()">Pay Now</button>
        <div id="status" class="gz-status"></div>
    </div>

    <script>
        const orderData = {
            order_id: "{{ order_id }}",
            amount: "{{ amount }}",
            key: "{{ key_id }}"
        };

        function startPayment() {
            const options = {
                key: orderData.key,
                amount: orderData.amount * 100,
                currency: "INR",
                name: "DraftZero",
                description: "Payment Transaction",
                order_id: orderData.order_id,
                handler: function (response) {
                    verifyPayment(response);
                },
                prefill: {
                    email: "customer@example.com",
                    contact: "9999999999"
                },
                theme: {
                    color: "#667eea"
                }
            };

            const rzp = new Razorpay(options);
            rzp.on('payment.failed', function (response) {
                showStatus('Payment Failed: ' + response.error.description, 'gz-error');
                updatePaymentStatus('failed');
            });
            rzp.open();
        }

        function verifyPayment(response) {
            showStatus('Verifying payment...', 'gz-processing');

            fetch('/verify-payment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    order_id: orderData.order_id,
                    payment_id: response.razorpay_payment_id,
                    signature: response.razorpay_signature
                })
            })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        showStatus('Payment Successful! ✓', 'gz-success');
                        setTimeout(() => window.close(), 3000);
                    } else {
                        showStatus('Payment verification failed', 'gz-error');
                    }
                })
                .catch(err => {
                    showStatus('Error: ' + err.message, 'gz-error');
                });
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = 'gz-status ' + type;
        }

        function updatePaymentStatus(status) {
            fetch('/update-payment-status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    order_id: orderData.order_id,
                    status: status
                })
            });
        }
    </script>
</body>
</html>
