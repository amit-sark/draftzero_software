<!DOCTYPE html>
<html>
<head>
    <title>Razorpay Payment</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
        }
        .container { 
            background: white; 
            padding: 40px; 
            border-radius: 15px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.2); 
            text-align: center;
            max-width: 400px;
        }
        h2 { color: #333; margin-bottom: 10px; }
        .amount { font-size: 32px; color: #667eea; font-weight: bold; margin: 20px 0; }
        .btn { 
            background: #667eea; 
            color: white; 
            border: none; 
            padding: 15px 40px; 
            font-size: 16px; 
            border-radius: 8px; 
            cursor: pointer; 
            margin-top: 20px;
            transition: background 0.3s;
        }
        .btn:hover { background: #5568d3; }
        .status { 
            margin-top: 20px; 
            padding: 15px; 
            border-radius: 8px; 
            display: none;
        }
        .success { background: #d4edda; color: #155724; display: block; }
        .error { background: #f8d7da; color: #721c24; display: block; }
        .processing { background: #fff3cd; color: #856404; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Complete Your Payment</h2>
        <div class="amount">₹{{ amount }}</div>
        <p>Order ID: <strong>{{ order_id }}</strong></p>
        <button class="btn" onclick="startPayment()">Pay Now</button>
        <div id="status" class="status"></div>
    </div>

    <script>
        const orderData = {
            order_id: "{{ order_id }}",
            amount: "{{ amount }}",
            key: "{{ key_id }}"
        };

        function startPayment() {
            const options = {
                key: orderData.key,
                amount: orderData.amount * 100,
                currency: "INR",
                name: "DraftZero",
                description: "Payment Transaction",
                order_id: orderData.order_id,
                handler: function(response) {
                    verifyPayment(response);
                },
                prefill: {
                    email: "customer@example.com",
                    contact: "9999999999"
                },
                theme: {
                    color: "#667eea"
                }
            };

            const rzp = new Razorpay(options);
            rzp.on('payment.failed', function(response) {
                showStatus('Payment Failed: ' + response.error.description, 'error');
                updatePaymentStatus('failed');
            });
            rzp.open();
        }

        function verifyPayment(response) {
            showStatus('Verifying payment...', 'processing');
            
            fetch('/verify-payment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    order_id: orderData.order_id,
                    payment_id: response.razorpay_payment_id,
                    signature: response.razorpay_signature
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    showStatus('Payment Successful! ✓', 'success');
                    setTimeout(() => window.close(), 3000);
                } else {
                    showStatus('Payment verification failed', 'error');
                }
            })
            .catch(err => {
                showStatus('Error: ' + err.message, 'error');
            });
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = 'status ' + type;
        }

        function updatePaymentStatus(status) {
            fetch('/update-payment-status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    order_id: orderData.order_id,
                    status: status
                })
            });
        }
    </script>
</body>
</html>
